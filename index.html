<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="BudgetTracker — Smart money management for families. Instant bank statement parsing, salary pockets envelope budgeting, and household finance sync." />
    
    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BudgetTracker" />
    <meta property="og:title" content="BudgetTracker — Smart Money Management for Families" />
    <meta property="og:description" content="Take control of your money simply & securely. Instant bank statement parsing, envelope budgeting, and real-time couple collaboration." />

    <!-- Twitter Preview -->

    <title>BudgetTracker — Smart Personal & Household Finance</title>
    <script>
      // Unregister any stale service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Apply saved theme immediately to prevent white flash (FOUC)
      (function() {
        try {
          var saved = localStorage.getItem('fintrack_data');
          if (saved) {
            var data = JSON.parse(saved);
            if (data.theme && data.theme.mode === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            }
          }
        } catch(e) {}
      })();
    </script>
    <style>html.dark{background:#090d16;color-scheme:dark}html.light{background:#fff;color-scheme:light}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
